# Add 'repo' label to any root file changes
repo:
  - changed-files:
      - any-glob-to-any-file: "*"

# Add 'ci' label to any changes in the '.github' directory
ci:
  - changed-files:
      - any-glob-to-any-file:
          - .github/**
          - .trunk/*
          - .trunk/*/**

# Add 'swift' label to any changes in Swift files
swift:
  - changed-files:
      - any-glob-to-any-file:
          - "*/*.swift"
          - "*/**/*.swift"

# Add 'docs' label to any changes in the 'doc' directory
docs:
  - changed-files:
      - any-glob-to-any-file:
          - doc/*
          - doc/*/**
          - README.md
