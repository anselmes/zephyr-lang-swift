name: West build

on:
  - push
  - pull_request

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: __name__
      - name: Set up west workspace
        run: |
          pip install west
          west init -l __name__
          west update
          west packages pip --install
      - name: Install the SDK
        run: west sdk install --no-gnu-toolchains --llvm
      - name: Build
        env:
          ZEPHYR_TOOLCHAIN_VARIANT: zephyr/llvm
        run: west build -p -b __board__ __name__/app
