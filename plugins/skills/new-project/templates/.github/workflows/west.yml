name: West build

on:
  - push
  - pull_request

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: __name__
          persist-credentials: false
      - name: Set up west workspace
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          pip install west pykwalify
          west init -l __name__
          west update
          west packages pip --install
          echo "VIRTUAL_ENV=${PWD}/.venv" >> "${GITHUB_ENV}"
          echo "${PWD}/.venv/bin" >> "${GITHUB_PATH}"
      - name: Install Swift
        env:
          SWIFT_VERSION: __swift-version__
        run: |
          curl -fsSL "https://download.swift.org/swiftly/linux/swiftly-$(uname -m).tar.gz" | tar -xz
          ./swiftly init --assume-yes --skip-install --quiet-shell-followup
          . "${SWIFTLY_HOME_DIR:-${HOME}/.local/share/swiftly}/env.sh"
          swiftly install --assume-yes --use "${SWIFT_VERSION}"
          swiftc --version
          swift build --version
          echo "${SWIFTLY_BIN_DIR:-${HOME}/.local/share/swiftly/bin}" >> "${GITHUB_PATH}"
      - name: Install the SDK
        run: west sdk install __sdk-args__
      - name: Build
        env:
          ZEPHYR_TOOLCHAIN_VARIANT: __toolchain__
        # Package.resolved pins any package used by URL; never resolve in CI.
        run: west build -p -d .build -b __board__ __name__/app -- -DZEPHYR_SWIFT_OFFLINE=ON
