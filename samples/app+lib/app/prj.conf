# Enable Swift support.
CONFIG_SWIFT=y

# Define SWIFT_DEBUG_INFO for Swift code, which logs extra debug lines at
# startup (seen only with logging at debug level, below). It does not add
# debug symbols. Uncomment to enable.
# CONFIG_SWIFT_DEBUG_INFO=y

# Logging, off by default. Uncomment to see Log output, such as the Hello
# library's "still running..." lines. Set the level to 4 to see Log.debug
# lines too, and turn off the function-name prefix on debug lines.
# CONFIG_SWIFT makes immediate log mode the default, so log lines and print()
# output appear in order.
# CONFIG_LOG=y
# CONFIG_LOG_DEFAULT_LEVEL=4
# CONFIG_LOG_FUNC_NAME_PREFIX_DBG=n

# The Embedded Swift runtime allocates through the libc heap, so a libc is
# required. The minimal libc is enough.
CONFIG_MINIMAL_LIBC=y

# Build the Hello library from the parent directory.
CONFIG_HELLO=y

# The minimal libc has no heap by default. Size the arena for the board and
# application; the Swift runtime allocates from it.
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=4096
