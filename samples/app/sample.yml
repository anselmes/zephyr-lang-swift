# Swift application sample.
#
# Shows how to:
# - define the entry point with @c(entrypoint)
# - build the Swift sources in src/ with zephyr_swift_application()
# - print and sleep with the Zephyr Swift library
#
# There is no `tests:` section, so `west twister` has nothing to run for this
# sample yet. Build and run it by hand, for example
# `west build -p -t run` with the environment from .env.example.

sample:
  name: Swift Application Sample
