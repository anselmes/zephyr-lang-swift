# Enable Swift support.
CONFIG_SWIFT=y

# Define SWIFT_DEBUG_INFO for Swift code, which prints two extra lines at
# startup. It does not add debug symbols. Uncomment to enable.
# CONFIG_SWIFT_DEBUG_INFO=y

# The Embedded Swift runtime allocates through the libc heap, so a libc is
# required. The minimal libc is enough.
CONFIG_MINIMAL_LIBC=y

# The minimal libc has no heap by default. Size the arena for the board and
# application; the Swift runtime allocates from it.
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=4096
